name: CI
on:
  push:
  workflow_dispatch:
jobs:
  pipeline:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the tools
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Package (pretend)
        run: echo "Putting it in a box..."
